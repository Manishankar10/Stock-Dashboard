<div id="tab-plan-calculator" class="tab-content" style="display: none;">
    <main class="pc-shell" style="width: 100%; margin: 0; padding: 0;">
        <!-- Selector Bar (Common Header Style as Watchlist & Portfolio) -->
        <div class="card-container" style="padding: 14px 20px; margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%;">
                    <span class="tools-label-title" style="font-weight: 600; color: var(--text-secondary); font-size: 13px; letter-spacing: 0.5px;">CALCULATORS:</span>
                    <nav id="calculator-tabs" class="portfolio-selector-bar" style="margin-bottom: 0; display: flex; gap: 6px; overflow-x: auto; flex-wrap: wrap;" aria-label="Choose a calculator"></nav>
                </div>
            </div>
        </div>
        <section class="pc-calculator-card" aria-live="polite">
            <div class="pc-card-heading"><div><h2 id="calculator-title">SIP Calculator</h2><p id="calculator-description"></p></div></div>
            <div class="pc-primary-layout">
                <div id="calculator-inputs" class="pc-input-panel"></div>
                <div id="calculator-summary" class="pc-summary-panel"></div>
            </div>
        </section>
        <section class="pc-chart-card">
            <div class="pc-chart-heading"><div><h2 id="chart-title">Investment growth</h2><p id="chart-description"></p></div><div id="chart-legend" class="pc-chart-legend"></div></div>
            <div id="calculator-chart" class="pc-chart" role="img" aria-label="Calculator value projection chart"></div>
        </section>
        <p class="pc-disclaimer">Calculator results are estimates based on the values entered. Actual returns, interest, taxes, and fees may differ.</p>
        <footer class="pc-footer">Capital Desk · Plan Calculator</footer>
    </main>
</div>
