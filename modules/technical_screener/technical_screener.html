<!-- ==============================================================================
     CAPITAL DESK - TECHNICAL SCREENER TAB VIEW (PHASE 1)
     Ultra-Modern Glassmorphic Terminal UX
     Location: modules/technical_screener/technical_screener.html
     ============================================================================== -->

<div id="tab-technical-screener" class="tab-content" style="display: none;">
    <div class="technical-screener-shell">

        <!-- 1. Top Glass Hero Strip with Controls & Scope Filter -->
        <header class="ts-hero-strip">
            <div class="ts-hero-title-area">
                <div class="ts-hero-title-row">
                    <h2 class="ts-hero-title">
                        <span>📐 Technical Screener</span>
                    </h2>
                    <span class="ts-live-pulse-badge">
                        <span class="ts-pulse-dot"></span>
                        <span id="ts-status-label">Live Radar</span>
                    </span>
                </div>
                <p class="ts-hero-subtitle">
                    Institutional momentum signals, multi-indicator algorithms &amp; algorithmic chart pattern screening
                </p>
            </div>

            <!-- Scope Segmented Control, Timeframe & Actions -->
            <div class="ts-hero-controls">
                <div class="ts-scope-segmented-bar" role="group" aria-label="Screener Scope Filter">
                    <button type="button" class="ts-scope-btn active" id="ts-scope-all" onclick="setTechnicalScreenerScope('all')" title="All tracked stocks across Portfolio and Watchlists">
                        <span>🌐</span><span>All Stocks</span>
                    </button>
                    <button type="button" class="ts-scope-btn" id="ts-scope-portfolio" onclick="setTechnicalScreenerScope('portfolio')" title="Portfolio holdings only">
                        <span>💼</span><span>Portfolio</span>
                    </button>
                    <button type="button" class="ts-scope-btn" id="ts-scope-watchlist" onclick="setTechnicalScreenerScope('watchlist')" title="Watchlist stocks only">
                        <span>⭐</span><span>Watchlist</span>
                    </button>
                </div>

                <!-- Watchlist Dropdown (Revealed when Scope is 'watchlist') -->
                <div id="ts-watchlist-dropdown-wrap" class="ts-watchlist-dropdown-wrap" style="display: none;" title="Choose Watchlist">
                    <span class="ts-wl-icon">📂</span>
                    <select id="ts-watchlist-select" class="ts-watchlist-select" onchange="onTechnicalScreenerWatchlistChange(this.value)">
                        <option value="__all__">All Watchlists (Combined)</option>
                    </select>
                </div>

                <!-- Timeframe Dropdown (Daily, Weekly, Monthly) -->
                <div class="ts-timeframe-dropdown-wrap" title="Screener Timeframe">
                    <span class="ts-tf-icon">⏱️</span>
                    <select id="ts-timeframe-select" class="ts-timeframe-select" onchange="setTechnicalScreenerTimeframe(this.value)">
                        <option value="daily" selected>1D (Daily)</option>
                        <option value="weekly">1W (Weekly)</option>
                        <option value="monthly">1M (Monthly)</option>
                    </select>
                </div>

                <button type="button" class="ts-action-btn primary" id="ts-btn-refresh-scan" onclick="triggerTechnicalScreenerScan(true)" title="Run real-time scan">
                    <span id="ts-refresh-icon">🔄</span>
                    <span id="ts-refresh-label">Scan Now</span>
                </button>
            </div>
        </header>

        <!-- 2. Floating Parent Category Navigation Deck -->
        <nav class="ts-category-deck" id="ts-category-deck" aria-label="Screener Parent Categories">
            <!-- Dynamically populated from Collection 1 hierarchy -->
            <button type="button" class="ts-cat-tab-btn active" onclick="switchTechnicalScreenerCategory('smart_scanners')">
                <span>⚡</span><span>Smart Scanners</span>
                <span class="ts-cat-tab-badge">16 Active</span>
            </button>
            <button type="button" class="ts-cat-tab-btn" onclick="switchTechnicalScreenerCategory('trendlines')">
                <span>📈</span><span>Trendlines</span>
                <span class="ts-cat-tab-badge">12 Active</span>
            </button>
            <button type="button" class="ts-cat-tab-btn" onclick="switchTechnicalScreenerCategory('triangles')">
                <span>📐</span><span>Triangles</span>
                <span class="ts-cat-tab-badge">8 Active</span>
            </button>
            <button type="button" class="ts-cat-tab-btn" onclick="switchTechnicalScreenerCategory('channels')">
                <span>⏸️</span><span>Channels</span>
                <span class="ts-cat-tab-badge">10 Active</span>
            </button>
            <button type="button" class="ts-cat-tab-btn" onclick="switchTechnicalScreenerCategory('nr_wr')">
                <span>📏</span><span>NR / WR</span>
                <span class="ts-cat-tab-badge">18 Active</span>
            </button>
            <button type="button" class="ts-cat-tab-btn" onclick="switchTechnicalScreenerCategory('chart_patterns')">
                <span>📊</span><span>Popular Patterns</span>
                <span class="ts-cat-tab-badge">26 Active</span>
            </button>
        </nav>

        <!-- 3. Real-Time Filter & Search Strip -->
        <div class="ts-filter-strip">
            <div class="ts-search-box">
                <span class="ts-search-icon">🔍</span>
                <input type="text" id="ts-search-input" class="ts-search-input" placeholder="Filter by symbol, name, or metric..." oninput="filterTechnicalScreenerResults()">
            </div>
            <div class="ts-stats-counter" id="ts-stats-counter">
                <span>Loading technical intelligence...</span>
            </div>
        </div>

        <!-- 4. Dynamic Screener Content Container -->
        <main id="ts-scanners-container">
            <!-- Rendered by technical_screener.js -->
            <div class="ts-screeners-grid">
                <div class="ts-screener-card ts-skeleton" style="height: 240px;"></div>
                <div class="ts-screener-card ts-skeleton" style="height: 240px;"></div>
                <div class="ts-screener-card ts-skeleton" style="height: 240px;"></div>
                <div class="ts-screener-card ts-skeleton" style="height: 240px;"></div>
            </div>
        </main>

    </div>
</div>
