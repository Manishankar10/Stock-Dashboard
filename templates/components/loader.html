<!-- =========================================================
     CAPITAL DESK - REUSABLE BRAND ANIMATED LOADER COMPONENT
     Location: templates/components/loader.html
     Interactive brand spinner matching technical chart loading
     ========================================================= -->

<template id="cd-brand-loader-template">
    <div class="cd-brand-loader">
        <div class="chart-loader-brand-box">
            <div class="chart-loader-spinner-ring"></div>
            <img src="/static/favicon-192.png" alt="Capital Desk Logo" class="chart-loader-logo">

        <div class="cd-loader-text-box">

        </div>
    </div>
</template>
