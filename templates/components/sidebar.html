<!-- Mobile Off-Canvas Backdrop Overlay -->

        <button type="button" class="sidebar-nav-item" id="sidebar-nav-insights" onclick="switchTab('insights'); closeMobileSidebarOnSelect();">

<!-- =========================================================
     SIDEBAR COMPONENT SCRIPT LOGIC
     ========================================================= -->
<script>
    // Collapse / Expand Desktop Sidebar Toggle
    function toggleSidebarCollapse(forceState) {
        const sidebar = document.getElementById('app-sidebar');
        const icon = document.getElementById('sidebar-toggle-icon');
        if (!sidebar) return;

        let shouldCollapse;
        if (typeof forceState === 'boolean') {
            shouldCollapse = forceState;
        } else {
            shouldCollapse = !sidebar.classList.contains('collapsed');
        }

        if (shouldCollapse) {
            sidebar.classList.add('collapsed');
            document.body.classList.add('sidebar-collapsed');
            if (icon) icon.innerText = '▶';
            localStorage.setItem('sidebarCollapsed', 'true');
        } else {
            sidebar.classList.remove('collapsed');
            document.body.classList.remove('sidebar-collapsed');
            if (icon) icon.innerText = '◀';
            localStorage.setItem('sidebarCollapsed', 'false');
        }
    }

    // Mobile Off-Canvas Drawer Toggle
    function toggleMobileSidebar(openState) {
        const sidebar = document.getElementById('app-sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        if (!sidebar) return;

        let shouldOpen;
        if (typeof openState === 'boolean') {
            shouldOpen = openState;
        } else {
            shouldOpen = !sidebar.classList.contains('mobile-open');
        }

        if (shouldOpen) {
            sidebar.classList.add('mobile-open');
            if (backdrop) backdrop.classList.add('mobile-open');
            document.body.style.overflow = 'hidden';
        } else {
            sidebar.classList.remove('mobile-open');
            if (backdrop) backdrop.classList.remove('mobile-open');
            document.body.style.overflow = '';
        }
    }

    function closeMobileSidebarOnSelect() {
        if (window.innerWidth <= 768) {
            toggleMobileSidebar(false);
        }
    }

    // Restore saved collapse preference on load
    document.addEventListener('DOMContentLoaded', function() {
        const saved = localStorage.getItem('sidebarCollapsed');
        if (saved === 'true' && window.innerWidth > 768) {
            toggleSidebarCollapse(true);
        }
    });

    // Keyboard shortcut (Ctrl + \) to toggle sidebar
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === '\\') {
            e.preventDefault();
            toggleSidebarCollapse();
        }
    });
</script>
