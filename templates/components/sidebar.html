<style>
/* Backdrop Overlay */
.sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    z-index: 999;
}
.sidebar-backdrop.mobile-open {
    display: block !important;
}

/* Shared dropdowns used by the sidebar, header and workspace row menus. */
.menu-dropdown-wrapper { position: relative; display: inline-block; }
.menu-dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    top: 110%;
    min-width: 220px;
    z-index: 10005;
    padding: 6px 0;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-card);
    box-shadow: var(--shadow-md);
}
.menu-dropdown-content.show { display: block !important; }
.menu-item { display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: var(--text-primary); font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s ease, color .15s ease; text-decoration: none; }
.menu-item:hover { background: var(--table-hover-bg); color: var(--btn-primary-bg); }
.menu-divider { height: 1px; margin: 4px 0; background: var(--border-color); }

/* Tools Menu Item & Submenu Accordion */
.tools-menu-item { position: relative; width: 100%; }
.tools-menu-trigger {
    width: 100%;
    justify-content: space-between;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font: inherit;
    text-align: left;
    cursor: pointer;
}
.tools-menu-trigger:hover {
    background-color: var(--table-hover-bg);
    color: var(--text-primary);
}
.sidebar-nav-arrow {
    margin-left: auto;
    color: var(--text-secondary);
    font-size: 16px;
    line-height: 1;
    transition: transform 0.2s ease;
}
.tools-menu-item.open .sidebar-nav-arrow {
    transform: rotate(90deg);
}

/* =========================================================
   TOOLS SUBMENU FLYOUT (Desktop: Hover right; Mobile: Accordion)
   ========================================================= */
@media (min-width: 769px) {
    .tools-submenu {
        display: none;
        position: fixed;
        left: 240px;
        min-width: 210px;
        padding: 6px;
        border: 1px solid var(--border-color);
        border-radius: 9px;
        background: var(--bg-card);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        z-index: 10005;
        flex-direction: column;
        gap: 3px;
        margin: 0;
    }

    .app-sidebar.collapsed .tools-submenu {
        left: 66px;
    }

    /* Invisible hover bridge to eliminate gap jitter when moving mouse into flyout */
    .tools-submenu::before {
        content: "";
        position: absolute;
        top: -8px;
        bottom: -8px;
        left: -16px;
        width: 18px;
        background: transparent;
    }

    /* Open submenu to the right on hover or when open class is active */
    .tools-menu-item:hover > .tools-submenu:not(.force-hidden),
    .tools-menu-item.open > .tools-submenu:not(.force-hidden) {
        display: flex !important;
    }

    /* Instantly disappear when clicked even if cursor is still hovering */
    .tools-submenu.force-hidden {
        display: none !important;
    }

    .tools-submenu .sidebar-nav-item {
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 6px;
        border: 0;
        text-decoration: none;
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-start !important;
    }

    .tools-submenu .sidebar-nav-text,
    .app-sidebar.collapsed .tools-submenu .sidebar-nav-text {
        display: inline !important;
    }

    .app-sidebar.collapsed .tools-submenu .sidebar-nav-item {
        justify-content: flex-start !important;
        padding: 8px 12px !important;
    }

    .tools-submenu .sidebar-nav-item:hover {
        background-color: var(--table-hover-bg);
        color: var(--text-primary);
    }
}

@media (max-width: 768px) {
    .tools-submenu {
        display: none;
        position: static;
        min-width: 0;
        margin: 3px 0 3px 14px;
        padding: 3px 0 3px 10px;
        border: 0;
        border-left: 2px solid var(--border-color);
        border-radius: 0;
        box-shadow: none;
        background: transparent;
        flex-direction: column;
        gap: 3px;
    }

    .tools-menu-item.open > .tools-submenu:not(.force-hidden) {
        display: flex !important;
    }

    .tools-submenu.force-hidden {
        display: none !important;
    }

    .tools-submenu .sidebar-nav-item {
        padding: 7px 10px;
        font-size: 12.5px;
        border-radius: 6px;
        border: 0;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: flex-start;
    }

    .tools-submenu .sidebar-nav-item:hover {
        background-color: var(--table-hover-bg);
        color: var(--text-primary);
    }
}

.app-sidebar.collapsed .sidebar-tools-row {
    flex-direction: column;
    gap: 6px;
}

.app-sidebar.collapsed .sidebar-user-card {
    justify-content: center;
    padding: 7px 0;
}

/* Desktop Workspace Margins */
@media (min-width: 769px) {
    .main-content-wrapper {
        margin-left: 240px;
    }
    body.sidebar-collapsed .main-content-wrapper,
    .app-sidebar.collapsed + .main-content-wrapper {
        margin-left: 66px;
    }
}

/* Mobile & Tablet Off-Canvas Drawer (< 769px) */
@media (max-width: 768px) {
    .mobile-top-bar {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
    }
    .app-sidebar {
        width: 260px !important;
        transform: translateX(-100%);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .app-sidebar.mobile-open {
        transform: translateX(0);
    }
    .main-content-wrapper {
        margin-left: 0 !important;
    }
    .sidebar-toggle-btn {
        display: none !important;
    }
    .sidebar-mobile-close {
        display: flex !important;
    }
    .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(4px);
        z-index: 999;
    }
    .sidebar-backdrop.mobile-open {
        display: block;
    }
}
</style>

<!-- =========================================================
     SIDEBAR COMPONENT SCRIPT LOGIC
     ========================================================= -->
<script>
    // Collapse / Expand Desktop Sidebar Toggle
    function toggleSidebarCollapse(forceState) {
        const sidebar = document.getElementById('app-sidebar');
        const icon = document.getElementById('sidebar-toggle-icon');
        if (!sidebar) return;

        let shouldCollapse;
        if (typeof forceState === 'boolean') {
            shouldCollapse = forceState;
        } else {
            shouldCollapse = !sidebar.classList.contains('collapsed');
        }

        if (shouldCollapse) {
            sidebar.classList.add('collapsed');
            document.body.classList.add('sidebar-collapsed');
            if (icon) icon.innerText = '▶';
            localStorage.setItem('sidebarCollapsed', 'true');
        } else {
            sidebar.classList.remove('collapsed');
            document.body.classList.remove('sidebar-collapsed');
            if (icon) icon.innerText = '◀';
            localStorage.setItem('sidebarCollapsed', 'false');
        }
        positionToolsSubmenu();
    }

    // Mobile Off-Canvas Drawer Toggle
    function toggleMobileSidebar(openState) {
        const sidebar = document.getElementById('app-sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        if (!sidebar) return;

        let shouldOpen;
        if (typeof openState === 'boolean') {
            shouldOpen = openState;
        } else {
            shouldOpen = !sidebar.classList.contains('mobile-open');
        }

        if (shouldOpen) {
            sidebar.classList.add('mobile-open');
            if (backdrop) backdrop.classList.add('mobile-open');
            document.body.style.overflow = 'hidden';
        } else {
            sidebar.classList.remove('mobile-open');
            if (backdrop) backdrop.classList.remove('mobile-open');
            document.body.style.overflow = '';
        }
    }

    function closeMobileSidebarOnSelect() {
        if (window.innerWidth <= 768) {
            toggleMobileSidebar(false);
        }
    }

    function toggleSettingsMenu(event) {
        if (event) {
            event.stopPropagation();
            event.preventDefault();
        }
        const wrapper = event && event.currentTarget ? event.currentTarget.closest('.sidebar-user-wrapper, .menu-dropdown-wrapper') : null;
        const dropdown = wrapper ? wrapper.querySelector('.menu-dropdown-content') : document.getElementById('settings-menu-dropdown');
        if (!dropdown) return;
        const shouldOpen = !dropdown.classList.contains('show');
        closeSettingsMenu();
        if (shouldOpen) dropdown.classList.add('show');
    }

    function toggleToolsSubmenu(event) {
        if (event) {
            event.stopPropagation();
            event.preventDefault();
        }
        const item = document.querySelector('.tools-menu-item');
        const trigger = document.getElementById('sidebar-nav-tools');
        if (!item) return;
        const submenu = item.querySelector('.tools-submenu');
        if (submenu) submenu.classList.remove('force-hidden');
        const open = item.classList.toggle('open');
        if (trigger) trigger.setAttribute('aria-expanded', String(open));
        if (open && window.innerWidth > 768) {
            positionToolsSubmenu();
        }
    }

    function positionToolsSubmenu() {
        if (window.innerWidth <= 768) return;
        const item = document.querySelector('.tools-menu-item');
        if (!item) return;
        const submenu = item.querySelector('.tools-submenu');
        if (!submenu) return;
        const bounds = item.getBoundingClientRect();
        const sidebar = document.getElementById('app-sidebar');
        const isCollapsed = sidebar && sidebar.classList.contains('collapsed');
        
        const submenuHeight = submenu.offsetHeight || 135;
        const maxTop = window.innerHeight - submenuHeight - 10;
        submenu.style.top = Math.max(10, Math.min(bounds.top, maxTop)) + 'px';
        submenu.style.left = (isCollapsed ? 66 : 240) + 'px';
    }

    function closeToolsSubmenu() {
        const item = document.querySelector('.tools-menu-item');
        if (item) {
            item.classList.remove('open');
            const submenu = item.querySelector('.tools-submenu');
            if (submenu) {
                submenu.classList.add('force-hidden');
            }
        }
        const trigger = document.getElementById('sidebar-nav-tools');
        if (trigger) trigger.setAttribute('aria-expanded', 'false');
    }

    function closeSettingsMenu() {
        document.querySelectorAll('.menu-dropdown-content.show').forEach(menu => menu.classList.remove('show'));
    }

    function toggleModuleTheme() {
        const pageThemeButton = document.getElementById('theme-toggle') || document.getElementById('mf-theme-toggle') || document.getElementById('pc-theme-toggle');
        const root = document.documentElement;
        if (pageThemeButton) pageThemeButton.click();
        else {
            const theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', theme);
            try { localStorage.setItem('capital_desk_theme', theme); } catch (error) {}
        }
        const icon = document.getElementById('sidebar-theme-icon');
        if (icon) icon.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }

    function toggleModulePrivacy() {
        const enabled = document.body.classList.toggle('module-privacy-mode');
        try { localStorage.setItem('capital_desk_privacy_mode', enabled ? 'true' : 'false'); } catch (error) {}
    }

    async function moduleLogout() {
        try { await fetch('/api/logout', { method: 'POST' }); } finally { window.location.replace('/login'); }
    }

    document.addEventListener('click', function(event) {
        if (!event.target.closest('.sidebar-user-wrapper, .menu-dropdown-wrapper')) {
            closeSettingsMenu();
        }
        if (!event.target.closest('.tools-menu-item')) {
            closeToolsSubmenu();
        }
    });

    // Restore saved collapse preference on load & bind tools submenu hover
    document.addEventListener('DOMContentLoaded', function() {
        const saved = localStorage.getItem('sidebarCollapsed');
        if (saved === 'true' && window.innerWidth > 768) {
            toggleSidebarCollapse(true);
        }

        const toolsItem = document.querySelector('.tools-menu-item');
        if (toolsItem) {
            toolsItem.addEventListener('mouseenter', function() {
                if (window.innerWidth > 768) {
                    positionToolsSubmenu();
                    const submenu = toolsItem.querySelector('.tools-submenu');
                    if (submenu) submenu.classList.remove('force-hidden');
                }
            });
            toolsItem.addEventListener('mouseleave', function() {
                const submenu = toolsItem.querySelector('.tools-submenu');
                if (submenu) submenu.classList.remove('force-hidden');
            });
        }

        const sidebarNav = document.querySelector('.sidebar-nav');
        if (sidebarNav) {
            sidebarNav.addEventListener('scroll', function() {
                if (window.innerWidth > 768) {
                    positionToolsSubmenu();
                }
            }, { passive: true });
        }
    });

    // Keyboard shortcut (Ctrl + \) to toggle sidebar
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === '\\') {
            e.preventDefault();
            toggleSidebarCollapse();
        }
    });

    // Instant Hover Prefetching for Zero-Latency Page Transitions
    (function() {
        function prefetchTarget(href) {
            if (!href || href.startsWith('#') || href.startsWith('javascript:') || href.startsWith('/api') || href.startsWith('/logout')) return;
            if (document.querySelector('link[rel="prefetch"][href="' + href + '"]')) return;
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
        }
        document.addEventListener('mouseover', function(e) {
            var a = e.target.closest('aside.app-sidebar a[href^="/"]');
            if (a) prefetchTarget(a.getAttribute('href'));
        }, { passive: true });
    })();
</script>
