<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ symbol }} - TradingView Chart | Capital Desk</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
        }
        #tv-top-bar {
            height: 42px;
            min-height: 42px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            user-select: none;
            z-index: 10;
        }
        .tv-bar-left, .tv-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tv-brand {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }
        .tv-symbol-pill {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            font-weight: 700;
        }
        .tv-sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 9999px;
            padding: 2px 8px;
        }
        .tv-sync-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        .tv-btn-external {
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease;
        }
        .tv-btn-external:hover {
            background: #1d4ed8;
            color: #ffffff;
        }
        .tv-btn-close {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #2a2e39;
            color: #94a3b8;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .tv-btn-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.4);
        }
        #tv_chart_container {
            flex: 1;
            width: 100%;
            height: calc(100% - 42px);
            position: relative;
        }
    </style>
</head>
<body>
    <div id="tv-top-bar">
        <div class="tv-bar-left">
            <span class="tv-brand">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                Capital Desk
            </span>
            <span class="tv-symbol-pill" id="tv-active-sym">{{ symbol }}</span>
            <span class="tv-sync-badge">
                <span class="tv-sync-dot"></span>
                Single-Window Sync Active
            </span>
        </div>
        <div class="tv-bar-right">
            <a id="tv-ext-link" class="tv-btn-external" href="https://in.tradingview.com/chart/?symbol={{ symbol | urlencode }}" target="_blank" title="Open full chart on in.tradingview.com">
                <span>Open in TradingView.com</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
            <button class="tv-btn-close" onclick="window.close()" title="Close this window">Close</button>
        </div>
    </div>
    <div id="tv_chart_container"></div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let currentSymbol = "{{ symbol }}";
        let tvWidget = null;

        function initTradingViewWidget(sym) {
            if (!sym) return;
            currentSymbol = sym;
            const symBadge = document.getElementById('tv-active-sym');
            if (symBadge) symBadge.textContent = sym;
            document.title = `${sym} - TradingView Chart | Capital Desk`;
            const extLink = document.getElementById('tv-ext-link');
            if (extLink) extLink.href = `https://in.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}`;
            
            const container = document.getElementById('tv_chart_container');
            if (!container) return;
            container.innerHTML = '';

            try {
                tvWidget = new TradingView.widget({
                    autosize: true,
                    symbol: sym,
                    interval: 'D',
                    timezone: 'Asia/Kolkata',
                    theme: 'dark',
                    style: '1',
                    locale: 'en',
                    toolbar_bg: '#1e222d',
                    enable_publishing: false,
                    allow_symbol_change: true,
                    container_id: 'tv_chart_container',
                    hide_side_toolbar: false,
                    save_image: true,
                    details: false,
                    hotlist: false,
                    calendar: false,
                    studies: [
                        'RSI@tv-basicstudies',
                        'MASimple@tv-basicstudies'
                    ]
                });
            } catch (err) {
                console.error('Failed to instantiate TradingView widget:', err);
            }
        }

        // Initialize with default or passed symbol
        initTradingViewWidget(currentSymbol);

        // 1. Listen for window postMessage
        window.addEventListener('message', function(event) {
            if (event.data && (event.data.symbol || event.data.type === 'LOAD_SYMBOL')) {
                const newSym = event.data.symbol;
                if (newSym && newSym !== currentSymbol) {
                    initTradingViewWidget(newSym);
                }
            }
        });

        // 2. BroadcastChannel redundancy (cross-tab / cross-window instant sync)
        try {
            if ('BroadcastChannel' in window) {
                const bc = new BroadcastChannel('capital_desk_tv_sync');
                bc.onmessage = function(event) {
                    if (event.data && event.data.symbol && event.data.symbol !== currentSymbol) {
                        initTradingViewWidget(event.data.symbol);
                    }
                };
            }
        } catch(_) {}
    </script>
</body>
</html>
